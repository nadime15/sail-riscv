# Remote bitbang configuration
adapter driver remote_bitbang
remote_bitbang port 9824
remote_bitbang host localhost

# Set adapter speed
adapter speed 1000

# Chip configuration
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef

# Target configuration - fix the variable assignment
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# Enable GDB data abort reporting
gdb_report_data_abort enable

# Initialize and halt
init
# Comment out 'halt' if you like, should not change much
halt
